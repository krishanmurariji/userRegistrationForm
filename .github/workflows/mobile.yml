# Builds the Android and iOS apps on GitHub's machines and attaches the results to the run.
# Start it from the Actions tab ("Run workflow"). It also runs when the app changes on master.
#
# Optional: in the repository settings, add a variable named API_URL (Settings, Secrets and variables, Actions,
# Variables) with the address of your hosted API, for example https://api.yourshop.com. The apps are then built to
# talk to it. Without it they are built against the placeholder address in app/src/environments/environment.ts.
name: Mobile apps

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '.github/workflows/mobile.yml'

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ vars.API_URL }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Point the app at the hosted API
        run: if [ -n "$API_URL" ]; then sed -i "s#https://api.example.com#$API_URL#" src/environments/environment.ts; fi
      - run: npm ci
      - run: npm run mobile:android
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: small-mart-android-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (simulator build)
    runs-on: macos-latest
    env:
      API_URL: ${{ vars.API_URL }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Point the app at the hosted API
        run: if [ -n "$API_URL" ]; then sed -i '' "s#https://api.example.com#$API_URL#" src/environments/environment.ts; fi
      - run: npm ci
      - run: npm run mobile:ios
      - name: Build for the iOS simulator (not signed)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Zip the app
        run: cd build/Build/Products/Debug-iphonesimulator && zip -r ../../../../small-mart-ios-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: small-mart-ios-simulator
          path: app/small-mart-ios-simulator.zip
