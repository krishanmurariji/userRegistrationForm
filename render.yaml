# Render "Blueprint": creates the free API service from this repository.
# The database is NOT created here: use the free Supabase database (see docs/DEPLOY.md).
services:
  - type: web
    name: smallmart-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__MigrateOnStartup
        value: "true"
      - key: Storage__Provider
        value: Database
      - key: App__DisableHttpsRedirect
        value: "true"
      - key: Jwt__Key
        generateValue: true
      # You fill these in on the Render dashboard (they are secrets or depend on you):
      - key: ConnectionStrings__Default
        sync: false
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
      - key: App__ClientUrl
        sync: false
